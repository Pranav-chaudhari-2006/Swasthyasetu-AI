name: SwasthyaSetu AI CI/CD & Cloud Deployment Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Automated Verification & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/gateway/package-lock.json
            frontend/package-lock.json

      - name: Install Gateway Dependencies
        run: |
          cd backend/gateway
          npm ci

      - name: Execute Gateway & E2E Integration Test Suite
        run: |
          cd backend/gateway
          npm test

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Execute Frontend Vitest Suite
        run: |
          cd frontend
          npm test

      - name: Compile Frontend Production Build
        run: |
          cd frontend
          npm run build

  deploy-cloud:
    name: Cloud Redeployment (Render & Vercel)
    needs: test-and-verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Frontend to Vercel
        uses: amondnet/vercel-action@v25
        if: env.VERCEL_TOKEN != ''
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Trigger Render Backend Deploy Hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
